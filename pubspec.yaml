name: kairete
description: Kairete mobile app (v2 rewrite)
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  get: ^4.6.6
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  flutter_html: ^3.0.0-beta.2
  file_picker: ^11.0.2
  video_player: ^2.8.6
  package_info_plus: ^9.0.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/juve_social/
