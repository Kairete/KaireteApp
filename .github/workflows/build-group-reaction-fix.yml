name: Kairete unified reaction summary and list APK
on:
  push:
    branches: [fix/reaction-names-native-login]
    paths:
      - .github/workflows/build-group-reaction-fix.yml
      - lib/features/groups/widgets/group_reaction_bar.dart
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Flutter analyze reaction and login
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/groups lib/features/omnifeed lib/features/auth
      - name: Build hub ARM64 debug
        run: flutter build apk --debug --flavor hub -t lib/main.dart --target-platform android-arm64 --dart-define=APP_VARIANT=hub
      - name: Publish isolated artifact
        run: |
          mkdir -p delivery
          APK=$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*debug*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" delivery/Kairete-Thread451-FirstPost-FIX-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kairete-Thread451-FirstPost-FIX-arm64-debug
          path: delivery/Kairete-Thread451-FirstPost-FIX-arm64-debug.apk
          retention-days: 7
