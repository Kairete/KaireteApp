name: Build APK (debug)

on:
  workflow_dispatch:
    inputs:
      upload_ftp:
        description: Carica Kairete-debug.apk sul server FTP
        type: boolean
        default: true
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.9"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Prepare APK for download
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          ls -la "$APK_DIR"
          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -name '*debug*.apk' | head -n 1)
          test -n "$APK_FILE"
          cp "$APK_FILE" Kairete-debug.apk
          ls -la Kairete-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairete-debug-apk
          path: Kairete-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: Kairete debug APK
          prerelease: true
          files: Kairete-debug.apk

      - name: Upload APK to FTP server
        if: ${{ secrets.FTP_HOST != '' && (github.event_name == 'push' || inputs.upload_ftp) }}
        run: |
          curl -T Kairete-debug.apk \
            --ftp-create-dirs \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}${{ secrets.FTP_DIR }}/Kairete-debug.apk"
