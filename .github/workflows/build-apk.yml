name: Build APK (debug)

on:
  workflow_dispatch:
    inputs:
      upload_ftp:
        description: Carica anche su FTP (secret FTP_* configurati)
        type: boolean
        default: false
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.9"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Rename APK for download
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk Kairete-debug.apk

      - name: Upload APK artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: kairete-debug-apk
          path: Kairete-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (link permanente)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug-${{ github.run_number }}
          name: Kairete debug APK #${{ github.run_number }}
          prerelease: true
          files: Kairete-debug.apk
          generate_release_notes: true

      - name: Prepare FTP upload folder
        if: github.event_name == 'workflow_dispatch' && inputs.upload_ftp == true
        run: mkdir -p ftp-upload && cp Kairete-debug.apk ftp-upload/

      - name: Upload to FTP (secret FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_DIR)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_ftp == true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ftp-upload/
          server-dir: ${{ secrets.FTP_DIR }}
