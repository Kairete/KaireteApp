name: Build APK (debug)

on:
  workflow_dispatch:
    inputs:
      app_variant:
        description: Variante app (hub = Kairete, juve_social = Juve Social)
        type: choice
        options:
          - hub
          - juve_social
        default: juve_social
      tenant_id:
        description: Tenant Multisite (solo juve_social)
        type: string
        default: "3"
      upload_ftp:
        description: Carica APK sul server FTP
        type: boolean
        default: true
      apk_basename:
        description: Nome file APK (senza .apk). Vuoto = default variante
        type: string
        default: ""
      ftp_remote_dir:
        description: Cartella FTP remota
        type: string
        default: "/public_html"
      app_display_name:
        description: Nome app (dart-define)
        type: string
        default: ""
      color_primary:
        description: Colore primario #RRGGBB
        type: string
        default: ""
      color_accent:
        description: Colore accent #RRGGBB
        type: string
        default: ""
      color_header:
        description: Colore header #RRGGBB
        type: string
        default: ""
      color_navbar:
        description: Colore navbar/tab #RRGGBB
        type: string
        default: ""
      color_appbar_border:
        description: Bordo header #RRGGBB
        type: string
        default: ""
      launcher_icon_url:
        description: URL PNG icona launcher (opzionale)
        type: string
        default: ""
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  FTP_HOST: 178.132.0.4
  APK_PUBLIC_BASE: https://www.kairete.it

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX=$(jq -cn \
              --arg app_variant "${{ inputs.app_variant }}" \
              --arg tenant_id "${{ inputs.tenant_id }}" \
              --arg do_ftp "${{ inputs.upload_ftp }}" \
              --arg apk_basename "${{ inputs.apk_basename }}" \
              --arg ftp_remote_dir "${{ inputs.ftp_remote_dir }}" \
              --arg app_display_name "${{ inputs.app_display_name }}" \
              --arg color_primary "${{ inputs.color_primary }}" \
              --arg color_accent "${{ inputs.color_accent }}" \
              --arg color_header "${{ inputs.color_header }}" \
              --arg color_navbar "${{ inputs.color_navbar }}" \
              --arg color_appbar_border "${{ inputs.color_appbar_border }}" \
              --arg launcher_icon_url "${{ inputs.launcher_icon_url }}" \
              '[{
                app_variant:$app_variant,
                tenant_id:$tenant_id,
                do_ftp:$do_ftp,
                apk_basename:$apk_basename,
                ftp_remote_dir:$ftp_remote_dir,
                app_display_name:$app_display_name,
                color_primary:$color_primary,
                color_accent:$color_accent,
                color_header:$color_header,
                color_navbar:$color_navbar,
                color_appbar_border:$color_appbar_border,
                launcher_icon_url:$launcher_icon_url
              }]')
          else
            MATRIX='[{"app_variant":"juve_social","tenant_id":"3","do_ftp":"true","apk_basename":"","ftp_remote_dir":"/public_html","app_display_name":"","color_primary":"","color_accent":"","color_header":"","color_navbar":"","color_appbar_border":"","launcher_icon_url":""}]'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: build-apk-${{ github.ref }}-${{ matrix.cfg.app_variant }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build variant
        run: |
          VARIANT="${{ matrix.cfg.app_variant }}"
          TENANT_ID="${{ matrix.cfg.tenant_id }}"
          DO_FTP="${{ matrix.cfg.do_ftp }}"
          CUSTOM_BASE="${{ matrix.cfg.apk_basename }}"
          FTP_DIR="${{ matrix.cfg.ftp_remote_dir }}"
          echo "APP_VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "TENANT_ID=$TENANT_ID" >> "$GITHUB_ENV"
          echo "DO_FTP=$DO_FTP" >> "$GITHUB_ENV"
          echo "APP_DISPLAY_NAME=${{ matrix.cfg.app_display_name }}" >> "$GITHUB_ENV"
          echo "COLOR_PRIMARY=${{ matrix.cfg.color_primary }}" >> "$GITHUB_ENV"
          echo "COLOR_ACCENT=${{ matrix.cfg.color_accent }}" >> "$GITHUB_ENV"
          echo "COLOR_HEADER=${{ matrix.cfg.color_header }}" >> "$GITHUB_ENV"
          echo "COLOR_NAVBAR=${{ matrix.cfg.color_navbar }}" >> "$GITHUB_ENV"
          echo "COLOR_APPBAR_BORDER=${{ matrix.cfg.color_appbar_border }}" >> "$GITHUB_ENV"
          echo "LAUNCHER_ICON_URL=${{ matrix.cfg.launcher_icon_url }}" >> "$GITHUB_ENV"
          if [ -z "$FTP_DIR" ]; then FTP_DIR="/public_html"; fi
          echo "FTP_REMOTE_DIR=$FTP_DIR" >> "$GITHUB_ENV"
          if [ "$VARIANT" = "juve_social" ]; then
            echo "FLAVOR=juveSocial" >> "$GITHUB_ENV"
            DEFAULT_BASE="JuveSocial"
            echo "VERSION_FILE=JuveSocial-app-version.txt" >> "$GITHUB_ENV"
          else
            echo "FLAVOR=hub" >> "$GITHUB_ENV"
            DEFAULT_BASE="Kairete"
            echo "VERSION_FILE=app-version.txt" >> "$GITHUB_ENV"
          fi
          if [ -n "$CUSTOM_BASE" ]; then
            SAFE=$(echo "$CUSTOM_BASE" | sed 's/[^A-Za-z0-9._-]//g' | sed 's/\.apk$//I')
            if [ -n "$SAFE" ]; then DEFAULT_BASE="$SAFE"; fi
          fi
          echo "APK_BASENAME=$DEFAULT_BASE" >> "$GITHUB_ENV"

      - name: Read build label
        run: |
          LABEL=$(grep "static const label" lib/config/app_build.dart | sed "s/.*= '\(.*\)';/\1/")
          STAMP=$(grep "static const stamp" lib/config/app_build.dart | sed "s/.*= '\(.*\)';/\1/")
          echo "BUILD_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "BUILD_STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "Build label: $LABEL ($STAMP) variant=$APP_VARIANT basename=$APK_BASENAME"

      - name: Apply launcher icon (URL or tenant branding asset)
        run: |
          set -e
          ICON_URL="${{ matrix.cfg.launcher_icon_url }}"
          if [ "$FLAVOR" = "juveSocial" ]; then
            ICON_ROOT="android/app/src/juveSocial/res"
            FALLBACK_ICON="assets/branding/juve_social/logo.png"
          else
            ICON_ROOT="android/app/src/main/res"
            FALLBACK_ICON=""
          fi
          TMP_ICON="$(mktemp /tmp/launcher-XXXXXX.png)"
          if [ -n "$ICON_URL" ]; then
            curl -fsSL "$ICON_URL" -o "$TMP_ICON"
            ICON_SRC="$ICON_URL"
          elif [ -n "$FALLBACK_ICON" ] && [ -f "$FALLBACK_ICON" ]; then
            cp "$FALLBACK_ICON" "$TMP_ICON"
            ICON_SRC="$FALLBACK_ICON"
          else
            echo "Nessuna icona launcher da applicare"
            rm -f "$TMP_ICON"
            exit 0
          fi
          # API 26+ usa adaptive icon: senza foreground dedicato resta l'icona hub (Kairete).
          mkdir -p "${ICON_ROOT}/mipmap-anydpi-v26" "${ICON_ROOT}/values"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@color/ic_launcher_background"/>' \
            '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' \
            '</adaptive-icon>' \
            > "${ICON_ROOT}/mipmap-anydpi-v26/ic_launcher.xml"
          cp "${ICON_ROOT}/mipmap-anydpi-v26/ic_launcher.xml" "${ICON_ROOT}/mipmap-anydpi-v26/ic_launcher_round.xml"
          if [ ! -f "${ICON_ROOT}/values/colors.xml" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              '    <color name="ic_launcher_background">#000000</color>' \
              '</resources>' \
              > "${ICON_ROOT}/values/colors.xml"
          fi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "${ICON_ROOT}/mipmap-$d"
            cp "$TMP_ICON" "${ICON_ROOT}/mipmap-$d/ic_launcher.png"
            cp "$TMP_ICON" "${ICON_ROOT}/mipmap-$d/ic_launcher_foreground.png"
            cp "$TMP_ICON" "${ICON_ROOT}/mipmap-$d/ic_launcher_round.png"
          done
          rm -f "$TMP_ICON"
          echo "Launcher adaptive icon applicata in $ICON_ROOT da $ICON_SRC"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # App requires Dart >=3.9 (pubspec). Flutter 3.16 era CI cannot resolve deps.
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (arm64)
        run: |
          set -o pipefail
          DEFINES=(
            "--dart-define=APP_VARIANT=$APP_VARIANT"
          )
          if [ "$APP_VARIANT" = "juve_social" ]; then
            DEFINES+=("--dart-define=TENANT_ID=$TENANT_ID")
          fi
          if [ -n "$APP_DISPLAY_NAME" ]; then
            DEFINES+=("--dart-define=APP_DISPLAY_NAME=$APP_DISPLAY_NAME")
          fi
          if [ -n "$COLOR_PRIMARY" ]; then
            DEFINES+=("--dart-define=COLOR_PRIMARY=$COLOR_PRIMARY")
          fi
          if [ -n "$COLOR_ACCENT" ]; then
            DEFINES+=("--dart-define=COLOR_ACCENT=$COLOR_ACCENT")
          fi
          if [ -n "$COLOR_HEADER" ]; then
            DEFINES+=("--dart-define=COLOR_HEADER=$COLOR_HEADER")
          fi
          if [ -n "$COLOR_NAVBAR" ]; then
            DEFINES+=("--dart-define=COLOR_NAVBAR=$COLOR_NAVBAR")
          fi
          if [ -n "$COLOR_APPBAR_BORDER" ]; then
            DEFINES+=("--dart-define=COLOR_APPBAR_BORDER=$COLOR_APPBAR_BORDER")
          fi
          flutter build apk --debug --flavor "$FLAVOR" --target-platform android-arm64 \
            "${DEFINES[@]}" 2>&1 | tee build.log

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "=== build.log (tail) ==="
          tail -n 120 build.log || true

      - name: Prepare APK for download
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          ls -la "$APK_DIR"
          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -name '*debug*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Nessun APK trovato in $APK_DIR"
            exit 1
          fi
          cp "$APK_FILE" "${APK_BASENAME}-debug.apk"
          cp "$APK_FILE" "${APK_BASENAME}-${BUILD_LABEL}.apk"
          SIZE=$(stat -c%s "${APK_BASENAME}-debug.apk")
          {
            echo "label=${BUILD_LABEL}"
            echo "stamp=${BUILD_STAMP}"
            echo "variant=${APP_VARIANT}"
            echo "tenant_id=${TENANT_ID}"
            echo "package=$([ "$APP_VARIANT" = "juve_social" ] && echo com.kairete.tenant.juve_social || echo com.kairete.app)"
            echo "sha=${{ github.sha }}"
            echo "size=${SIZE}"
            echo "built=${{ github.run_id }}"
            echo "download=${APK_PUBLIC_BASE}/${APK_BASENAME}-debug.apk"
          } > "$VERSION_FILE"
          ls -la "${APK_BASENAME}-debug.apk" "${APK_BASENAME}-${BUILD_LABEL}.apk" "$VERSION_FILE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}-debug-${{ env.BUILD_LABEL }}
          path: |
            ${{ env.APK_BASENAME }}-debug.apk
            ${{ env.APK_BASENAME }}-${{ env.BUILD_LABEL }}.apk
            ${{ env.VERSION_FILE }}

      - name: Publish GitHub Release (hub)
        if: env.APP_VARIANT == 'hub'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kairete · ${{ env.BUILD_LABEL }} — SCARICA QUESTO
          body: |
            ## Hub Kairete
            - **Scarica:** `${{ env.APK_BASENAME }}-${{ env.BUILD_LABEL }}.apk`
            - **FTP:** ${{ env.APK_PUBLIC_BASE }}/${{ env.APK_BASENAME }}-debug.apk
            - **Build:** ${{ env.BUILD_LABEL }} · ${{ env.BUILD_STAMP }}

            Juve Social: https://github.com/${{ github.repository }}/releases/tag/juve-social-latest
          make_latest: true
          files: |
            ${{ env.APK_BASENAME }}-debug.apk
            ${{ env.APK_BASENAME }}-${{ env.BUILD_LABEL }}.apk
            ${{ env.VERSION_FILE }}

      - name: Publish GitHub Release (Juve Social)
        if: env.APP_VARIANT == 'juve_social'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: juve-social-latest
          name: Juve Social · ${{ env.BUILD_LABEL }} — SCARICA QUESTO
          body: |
            ## Juve Social (tenant ${{ env.TENANT_ID }})
            - **Scarica:** `${{ env.APK_BASENAME }}-${{ env.BUILD_LABEL }}.apk`
            - **FTP:** ${{ env.APK_PUBLIC_BASE }}/${{ env.APK_BASENAME }}-debug.apk
            - **Package:** `com.kairete.tenant.juve_social`
            - **Build:** ${{ env.BUILD_LABEL }} · ${{ env.BUILD_STAMP }}

            Richiede Multisite **1.9.170+** su kairete.it.
          make_latest: true
          files: |
            ${{ env.APK_BASENAME }}-debug.apk
            ${{ env.APK_BASENAME }}-${{ env.BUILD_LABEL }}.apk
            ${{ env.VERSION_FILE }}

      - name: Upload APK to FTP server
        if: env.DO_FTP == 'true'
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Alias comuni se i secret sono stati creati con altri nomi
          FTP_USER_ALT: ${{ secrets.FTP_USERNAME }}
          FTP_PASS_ALT: ${{ secrets.FTP_PASS }}
        run: |
          USER="${FTP_USER:-$FTP_USER_ALT}"
          PASS="${FTP_PASSWORD:-$FTP_PASS_ALT}"
          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::FTP non configurato. Crea i repository secret FTP_USER e FTP_PASSWORD (Settings → Secrets → Actions)."
            exit 1
          fi
          BASE="ftp://${FTP_HOST}${FTP_REMOTE_DIR}"
          for local in "${APK_BASENAME}-debug.apk" "${APK_BASENAME}-${BUILD_LABEL}.apk" "$VERSION_FILE"; do
            echo "Upload → ${BASE}/${local}"
            curl --fail --show-error \
              -T "${local}" \
              --ftp-create-dirs \
              --ftp-pasv \
              -u "${USER}:${PASS}" \
              "${BASE}/${local}"
          done
          echo "APK pubblico: ${APK_PUBLIC_BASE}/${APK_BASENAME}-debug.apk"
          echo "FTP_PUBLIC_URL=${APK_PUBLIC_BASE}/${APK_BASENAME}-debug.apk" >> "$GITHUB_ENV"

      - name: Riepilogo build
        run: |
          {
            echo "## APK ${APK_BASENAME}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Variante | \`${APP_VARIANT}\` |"
            echo "| Label | \`${BUILD_LABEL}\` · \`${BUILD_STAMP}\` |"
            echo "| Artifact | \`${APK_BASENAME}-debug-${BUILD_LABEL}\` |"
            echo "| FTP | ${APK_PUBLIC_BASE}/${APK_BASENAME}-debug.apk |"
            echo "| Release | https://github.com/${{ github.repository }}/releases |"
          } >> "$GITHUB_STEP_SUMMARY"
