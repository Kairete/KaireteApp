name: Build APK (debug)

on:
  workflow_dispatch:
    inputs:
      upload_ftp:
        description: Carica Kairete-debug.apk sul server FTP
        type: boolean
        default: true
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  FTP_HOST: 178.132.0.4
  FTP_REMOTE_PATH: /public_html/Kairete-debug.apk
  APK_PUBLIC_URL: https://www.kairete.it/Kairete-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.9"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Prepare APK for download
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          ls -la "$APK_DIR"
          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -name '*debug*.apk' | head -n 1)
          test -n "$APK_FILE"
          cp "$APK_FILE" Kairete-debug.apk
          ls -la Kairete-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairete-debug-apk
          path: Kairete-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: Kairete debug APK
          prerelease: true
          files: Kairete-debug.apk

      - name: Upload APK to FTP server
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_ftp == true)
        run: |
          if [ -z "${{ secrets.FTP_USER }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::Configurate i secret FTP_USER e FTP_PASSWORD su GitHub (Settings → Secrets → Actions)"
            exit 1
          fi
          echo "Upload → ftp://${FTP_HOST}${FTP_REMOTE_PATH}"
          curl -v --fail --show-error \
            -T Kairete-debug.apk \
            --ftp-create-dirs \
            --ftp-pasv \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${FTP_HOST}${FTP_REMOTE_PATH}"
          echo "APK pubblicato: ${APK_PUBLIC_URL}"
